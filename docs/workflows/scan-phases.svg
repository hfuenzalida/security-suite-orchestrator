<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Security scan phase pipeline">
  <defs>
    <marker id="sp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .p { fill: #fff; stroke: #475569; stroke-width: 1.2; }
      .static { fill: #ecfdf5; stroke: #059669; }
      .dynamic { fill: #fef3c7; stroke: #d97706; }
      .out { fill: #eff6ff; stroke: #2563eb; }
      .t { font: 600 14px system-ui,sans-serif; fill: #0f172a; }
      .l { font: 11px system-ui,sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="900" height="380" fill="#f8fafc"/>
  <text x="450" y="28" text-anchor="middle" class="t">Security Suite Orchestrator — default phase order</text>
  <text x="120" y="58" class="l">Inputs: --path (source tree) · --url (HTTP target, optional)</text>
  <rect x="40" y="75" width="95" height="42" rx="6" class="static"/>
  <text x="87" y="100" text-anchor="middle" class="l">code_ai</text>
  <line x1="135" y1="96" x2="155" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="155" y="75" width="95" height="42" rx="6" class="static"/>
  <text x="202" y="100" text-anchor="middle" class="l">secrets</text>
  <line x1="250" y1="96" x2="270" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="270" y="75" width="80" height="42" rx="6" class="static"/>
  <text x="310" y="100" text-anchor="middle" class="l">SAST</text>
  <line x1="350" y1="96" x2="370" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="370" y="75" width="80" height="42" rx="6" class="static"/>
  <text x="410" y="100" text-anchor="middle" class="l">deps</text>
  <line x1="450" y1="96" x2="470" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="470" y="75" width="80" height="42" rx="6" class="dynamic"/>
  <text x="510" y="100" text-anchor="middle" class="l">recon</text>
  <line x1="550" y1="96" x2="570" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="570" y="75" width="75" height="42" rx="6" class="dynamic"/>
  <text x="607" y="100" text-anchor="middle" class="l">DAST</text>
  <line x1="645" y1="96" x2="665" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="665" y="75" width="85" height="42" rx="6" class="dynamic"/>
  <text x="707" y="100" text-anchor="middle" class="l">browser</text>
  <line x1="750" y1="96" x2="770" y2="96" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="770" y="75" width="70" height="42" rx="6" class="dynamic"/>
  <text x="805" y="100" text-anchor="middle" class="l">ZAP</text>
  <rect x="200" y="140" width="500" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="450" y="163" text-anchor="middle" class="l">Optional: auth · chain · agents · exploit · ai reasoning (--skip tokens disable phases)</text>
  <line x1="450" y1="176" x2="450" y2="210" stroke="#334155" marker-end="url(#sp)"/>
  <rect x="280" y="210" width="340" height="50" rx="8" class="out"/>
  <text x="450" y="233" text-anchor="middle" class="l">Unified findings JSON (CI gate truth)</text>
  <text x="450" y="250" text-anchor="middle" class="l">SARIF · JUnit · HTML · PDF tiers</text>
  <rect x="80" y="280" width="740" height="80" rx="8" class="p"/>
  <text x="450" y="308" text-anchor="middle" class="l">Checkpoints under scan_workspace/ enable --resume; doctor profiles verify tool matrix</text>
  <text x="450" y="330" text-anchor="middle" class="l">Green = codebase only · Amber = requires --url for dynamic testing</text>
</svg>