[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "security-suite-orchestrator"
version = "0.2.9"
description = "Local security scan orchestrator (SAST, DAST, Ollama, checkpoints)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
security-scan = "security_scan:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secscan*"]

[tool.setuptools]
py-modules = ["security_scan"]

[project.optional-dependencies]
full = [
  "fpdf2>=2.7.0",
  "playwright>=1.40.0",
  "pyotp>=2.9.0",
]
dev = [
  "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
